name: HealthGraph KMP CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dkotlin.daemon.jvm.options=-Xmx2g"

jobs:
  # ===========================================
  # LINT & STATIC ANALYSIS
  # ===========================================
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kmp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Run KtLint
        run: ./gradlew :shared:ktlintCheck :composeApp:ktlintCheck --no-daemon

      - name: Run Detekt
        run: ./gradlew :shared:detekt :composeApp:detekt --no-daemon

      - name: Run Android Lint
        run: ./gradlew :composeApp:lintDebug --no-daemon

  # ===========================================
  # UNIT TESTS
  # ===========================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: kmp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Run Unit Tests (JVM)
        run: ./gradlew :shared:jvmTest :composeApp:jvmTest --no-daemon --max-workers=2

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            kmp/**/build/reports/tests/**/*
            kmp/**/build/test-results/**/*

  # ===========================================
  # BUILD ANDROID
  # ===========================================
  build-android:
    name: Build Android (Debug)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, unit-tests]
    defaults:
      run:
        working-directory: kmp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r27b
          cmake-version: 3.22.1

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Build Debug APK
        run: ./gradlew :composeApp:assembleDebug --no-daemon --max-workers=2

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: kmp/composeApp/build/outputs/apk/debug/*.apk
          retention-days: 7

  # ===========================================
  # BUILD iOS (macOS runner)
  # ===========================================
  build-ios:
    name: Build iOS (Debug)
    runs-on: macos-latest
    timeout-minutes: 30
    needs: [lint, unit-tests]
    defaults:
      run:
        working-directory: kmp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Build iOS Framework
        run: ./gradlew :composeApp:linkDebugFrameworkIosArm64 :composeApp:linkDebugFrameworkIosSimulatorArm64 --no-daemon --max-workers=2

      - name: Upload iOS Framework
        uses: actions/upload-artifact@v4
        with:
          name: ios-framework
          path: kmp/composeApp/build/bin/iosArm64/debugFramework/
          retention-days: 7

  # ===========================================
  # BUILD DESKTOP (JVM)
  # ===========================================
  build-desktop:
    name: Build Desktop (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, unit-tests]
    defaults:
      run:
        working-directory: kmp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Build Desktop Distribution
        run: ./gradlew :composeApp:packageDistributionForCurrentOS --no-daemon --max-workers=2

      - name: Upload Desktop App
        uses: actions/upload-artifact@v4
        with:
          name: desktop-app
          path: kmp/composeApp/build/compose/binaries/main/dmg/
          retention-days: 7

  # ===========================================
  # BUILD WEB (WASM)
  # ===========================================
  build-web:
    name: Build Web (WASM)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [lint, unit-tests]
    defaults:
      run:
        working-directory: kmp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Build WASM JS
        run: ./gradlew :composeApp:wasmJsBrowserDevelopmentRun --no-daemon --max-workers=2

      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: kmp/composeApp/build/dist/wasmJs/productionExecutable/
          retention-days: 7

  # ===========================================
  # RELEASE BUILD (on tag push)
  # ===========================================
  release:
    name: Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-ios, build-desktop, build-web]
    permissions:
      contents: write
    defaults:
      run:
        working-directory: kmp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r27b

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Build Release APK
        run: ./gradlew :composeApp:assembleRelease --no-daemon --max-workers=2

      - name: Build Release AAB
        run: ./gradlew :composeApp:bundleRelease --no-daemon --max-workers=2

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            kmp/composeApp/build/outputs/apk/release/*.apk
            kmp/composeApp/build/outputs/bundle/release/*.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================
  # DEPENDENCY CHECK
  # ===========================================
  dependency-check:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: kmp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper

      - name: Run Dependency Check
        run: ./gradlew :shared:dependencyCheckAnalyze :composeApp:dependencyCheckAnalyze --no-daemon

      - name: Upload Dependency Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-reports
          path: |
            kmp/**/build/reports/dependency-check/**/*
          retention-days: 30

  # ===========================================
  # FINAL STATUS
  # ===========================================
  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, build-android, build-ios, build-desktop, build-web, dependency-check]
    if: always()
    steps:
      - name: Check Job Status
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.unit-tests.result }}" != "success" ]] || \
             [[ "${{ needs.build-android.result }}" != "success" ]] || \
             [[ "${{ needs.build-ios.result }}" != "success" ]] || \
             [[ "${{ needs.build-desktop.result }}" != "success" ]] || \
             [[ "${{ needs.build-web.result }}" != "success" ]] || \
             [[ "${{ needs.dependency-check.result }}" != "success" ]]; then
            echo "Some jobs failed"
            exit 1
          fi
          echo "All checks passed!"