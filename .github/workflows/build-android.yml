name: Build Android (preview)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  checks:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      # 8 files (ppg/rppg/voice contracts + batch wiring) fail under plain
      # node because native-module imports need the Metro resolver — they
      # fail identically on a clean tree. Informational until that harness
      # exists; everything else must pass.
      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        run: node --experimental-sqlite --experimental-strip-types --test "tests/*.test.mts" 2>&1 | tail -n 12

      - name: JS bundle export (ppg, rppg, food scan, chat paths included)
        run: npx expo export --platform android --output-dir /tmp/hg-export

  build:
    name: Assemble release APK (self-contained preview)
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      # actions/upload-artifact needs no extra scope; the release fallback
      # below needs contents:write to attach the APK to a rolling release.
      contents: write
    env:
      # Same public runtime config as the release workflow — without these
      # the bundled JS boots against empty API/Firebase/CDN URLs and dies
      # on launch. Values live in GitHub Actions Variables (no secrets).
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_ASSET_CDN_URL: ${{ vars.EXPO_PUBLIC_ASSET_CDN_URL }}
      EXPO_PUBLIC_ANATOMY_CDN_URL: ${{ vars.EXPO_PUBLIC_ANATOMY_CDN_URL }}
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Native compile (reanimated C++) needs room: drop the heavy
      # SDKs this job never touches.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install dependencies
        run: npm ci

      # android/ is gitignored (Expo continuous native generation):
      # regenerate it from app.json + config plugins on the runner.
      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install

      # Release (not debug): the APK carries its own bundled JS + Hermes
      # bytecode, so testers install and run it with no dev server.
      # Signed with the Expo template debug key — for testers only,
      # never for the Play Console.
      - name: Assemble release APK
        working-directory: frontend/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      # Gate: prove the native modules that the on-device features depend on
      # are actually inside the APK.
      #
      # Why this exists: a local Expo module is autolinked from its
      # package.json + expo-module.config.json. If either file is missing
      # from the checkout, Expo silently skips the module — the Kotlin/Swift
      # code is never compiled, requireOptionalNativeModule() resolves to
      # null at runtime, and the feature reports itself "unavailable"
      # instead of failing the build. That silently shipped a dead face
      # rPPG once already. This step turns that silent failure into a
      # red build.
      - name: Verify native modules in APK
        run: |
          # GitHub runs every `run:` block with `bash -e`, so errexit is ON
          # regardless of what this script sets. This step is a gate that
          # must report EVERY problem in one pass, so errexit is turned off
          # explicitly and the outcome is decided by $FAILED at the end.
          # A `grep` that matches nothing exits 1; under -e that would abort
          # the step on a diagnostic line, not on a real failure.
          set +e
          set -uo pipefail

          # The job's working-directory is `frontend`, so the APK lives under
          # `android/...` relative to it. Discover it instead of hardcoding
          # one path so a layout change reports what was actually produced.
          APK=$(find android -type f -name '*.apk' -path '*outputs/apk/release*' 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "FAIL: no release APK under android/**/outputs/apk/release"
            find android -type f -name '*.apk' 2>/dev/null | head -20
            exit 1
          fi
          echo "APK: $APK ($(stat -c %s "$APK") bytes)"

          WORK=$(mktemp -d)
          unzip -q -o "$APK" -d "$WORK"

          FAILED=0

          echo "--- ABIs in APK (arm64-v8a only expected) ---"
          mapfile -t ABIS < <(find "$WORK/lib" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' 2>/dev/null | sort)
          if [ "${#ABIS[@]}" -eq 0 ]; then
            echo "FAIL: no lib/ directory in APK"
            FAILED=1
          else
            printf '%s\n' "${ABIS[@]}"
            if [ "${#ABIS[@]}" -ne 1 ] || [ "${ABIS[0]}" != "arm64-v8a" ]; then
              echo "FAIL: expected only arm64-v8a, got: ${ABIS[*]}"
              FAILED=1
            else
              echo "OK: arm64-v8a only"
            fi
          fi

          echo "--- native module classes in dex ---"
          for CLS in \
            "com/healthgraph/rppg/HealthGraphRPPGModule" \
            "com/healthgraph/ppg/HealthGraphPPGModule" ; do
            FOUND=0
            for DEX in "$WORK"/classes*.dex; do
              if strings "$DEX" 2>/dev/null | grep -q "$CLS"; then FOUND=1; break; fi
            done
            if [ "$FOUND" -ne 1 ]; then
              echo "FAIL: native module class missing from APK: $CLS"
              FAILED=1
            else
              echo "OK: $CLS present"
            fi
          done
          echo "--- healthgraph classes actually in the dex ---"
          for DEX in "$WORK"/classes*.dex; do
            strings "$DEX" 2>/dev/null | grep -oE 'com/healthgraph/[a-z]+/[A-Za-z]+'
          done | sort -u | head -20 || true

          echo "--- onnxruntime native lib (face rPPG inference) ---"
          if [ -f "$WORK/lib/arm64-v8a/libonnxruntime.so" ]; then
            echo "OK: libonnxruntime.so present"
          else
            echo "FAIL: libonnxruntime.so missing"
            ls "$WORK/lib/arm64-v8a" 2>/dev/null | head -20
            FAILED=1
          fi

          rm -rf "$WORK"
          if [ "$FAILED" -ne 0 ]; then
            echo "APK verification FAILED"
            exit 1
          fi
          echo "APK verification passed"

      # Deliver the APK. The Actions artifact store has a 500 MB free-tier
      # quota whose usage counter only recalculates every 6-12 hours, so
      # after deleting old artifacts the store still rejects new uploads
      # and the run fails at the very last step — throwing away a 28-minute
      # build. A rolling GitHub Release uses a separate storage pool, so
      # that is the primary delivery path; the artifact upload is kept as a
      # best-effort convenience.
      - name: Publish APK to rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=frontend/android/app/build/outputs/apk/release/app-release.apk
          TAG=preview-apk
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Preview APK (rolling)" \
              --notes "Rolling preview build. Replaced on every successful run of the Build Android (preview) workflow." \
              --target "${{ github.sha }}"
          fi
          gh release upload "$TAG" "$APK#app-release.apk" --clobber
          echo "Release $TAG updated."

      - name: Upload APK as workflow artifact (best effort)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: healthgraph-preview-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          # Keep the artifact store well under the 500 MB free-tier quota:
          # a stale preview-apk plus a new one already filled it once and
          # failed the run at upload time (after a 26-minute build).
          retention-days: 7
