name: Build Android (preview)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

jobs:
  checks:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      # 8 files (ppg/rppg/voice contracts + batch wiring) fail under plain
      # node because native-module imports need the Metro resolver — they
      # fail identically on a clean tree. Informational until that harness
      # exists; everything else must pass.
      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        run: node --experimental-sqlite --experimental-strip-types --test "tests/*.test.mts" 2>&1 | tail -n 12

      - name: JS bundle export (ppg, rppg, food scan, chat paths included)
        run: npx expo export --platform android --output-dir /tmp/hg-export

  build:
    name: Assemble release APK (self-contained preview)
    needs: checks
    runs-on: ubuntu-latest
    env:
      # Same public runtime config as the release workflow — without these
      # the bundled JS boots against empty API/Firebase/CDN URLs and dies
      # on launch. Values live in GitHub Actions Variables (no secrets).
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_ASSET_CDN_URL: ${{ vars.EXPO_PUBLIC_ASSET_CDN_URL }}
      EXPO_PUBLIC_ANATOMY_CDN_URL: ${{ vars.EXPO_PUBLIC_ANATOMY_CDN_URL }}
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ vars.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Native compile (reanimated C++) needs room: drop the heavy
      # SDKs this job never touches.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install dependencies
        run: npm ci

      # android/ is gitignored (Expo continuous native generation):
      # regenerate it from app.json + config plugins on the runner.
      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install

      # Release (not debug): the APK carries its own bundled JS + Hermes
      # bytecode, so testers install and run it with no dev server.
      # Signed with the Expo template debug key — for testers only,
      # never for the Play Console.
      - name: Assemble release APK
        working-directory: frontend/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      # Gate: prove the native modules that the on-device features depend on
      # are actually inside the APK.
      #
      # Why this exists: a local Expo module is autolinked from its
      # package.json + expo-module.config.json. If either file is missing
      # from the checkout, Expo silently skips the module — the Kotlin/Swift
      # code is never compiled, requireOptionalNativeModule() resolves to
      # null at runtime, and the feature reports itself "unavailable"
      # instead of failing the build. That silently shipped a dead face
      # rPPG once already. This step turns that silent failure into a
      # red build.
      - name: Verify native modules in APK
        run: |
          set -euo pipefail
          APK=frontend/android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "APK not found"; exit 1; }
          WORK=$(mktemp -d)
          unzip -q -o "$APK" -d "$WORK"

          echo "--- ABIs in APK (arm64-only expected) ---"
          mapfile -t ABIS < <(find "$WORK/lib" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          printf '%s\n' "${ABIS[@]}"
          if [ "${#ABIS[@]}" -ne 1 ] || [ "${ABIS[0]}" != "arm64-v8a" ]; then
            echo "FAIL: expected only arm64-v8a, got: ${ABIS[*]}"
            exit 1
          fi

          echo "--- native module classes in dex ---"
          for CLS in \
            "com/healthgraph/rppg/HealthGraphRPPGModule" \
            "com/healthgraph/ppg/HealthGraphPPGModule" ; do
            FOUND=0
            for DEX in "$WORK"/classes*.dex; do
              if strings "$DEX" | grep -q "$CLS"; then FOUND=1; break; fi
            done
            if [ "$FOUND" -ne 1 ]; then
              echo "FAIL: native module class missing from APK: $CLS"
              exit 1
            fi
            echo "OK: $CLS present"
          done

          echo "--- onnxruntime native lib (face rPPG inference) ---"
          test -f "$WORK/lib/arm64-v8a/libonnxruntime.so" || {
            echo "FAIL: libonnxruntime.so missing"; exit 1; }
          echo "OK: libonnxruntime.so present"

          rm -rf "$WORK"
          echo "APK verification passed"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: healthgraph-preview-apk
          path: frontend/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
