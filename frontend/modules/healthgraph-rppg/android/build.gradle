plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.healthgraph.rppg'
version = '1.0.0'

// SDK versions, Kotlin toolchain, lint, and the expo-modules-core dependency
// are managed by expo-module-gradle-plugin from the project's Expo/RN
// versions. Do NOT hardcode compileSdk/minSdk here — that breaks the
// manifest merger and drifts from the app (Expo SDK 57, new arch).

android {
  namespace 'com.healthgraph.rppg'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'androidx.camera:camera-core:1.3.4'
  implementation 'androidx.camera:camera-camera2:1.3.4'
  implementation 'androidx.camera:camera-lifecycle:1.3.4'
}
