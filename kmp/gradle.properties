# HealthGraph KMP - Gradle Properties
# Standard configuration
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -XX:MaxGCPauseMillis=100
kotlin.daemon.jvm.options=-Xmx2g -XX:MaxMetaspaceSize=512m
kotlin.compiler.execution.strategy=in-process
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true
android.enableR8.fullMode=true
kotlin.incremental=true
kotlin.incremental.js=true
kotlin.incremental.useClasspathSnapshot=true

# ===========================================
# LOW MEMORY PROFILE (for CI / constrained environments)
# Activate with: ./gradlew -PlowMemory <task>
# ===========================================
# org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -XX:MaxGCPauseMillis=200
# kotlin.daemon.jvm.options=-Xmx1g -XX:MaxMetaspaceSize=256m
# org.gradle.parallel=false
# org.gradle.workers.max=2
# kotlin.compiler.execution.strategy=in-process
# android.enableR8.fullMode=false

# ===========================================
# KMP Configuration
# ===========================================
kmp.androidTargetApi=34
kmp.minSdk=24
kmp.compileSdk=34
kmp.namespace=com.healthgraph.app
kmp.applicationId=com.healthgraph.app

# Compose Multiplatform
compose.version=1.6.10
compose.compiler.version=1.5.14

# Kotlin
kotlin.version=1.9.24

# Coroutines
coroutines.version=1.8.0

# Serialization
serialization.version=1.6.3

# Voyager Navigation
voyager.version=1.4.0

# Coil Image Loading
coil.version=2.6.0

# Room Database
room.version=2.6.1

# Koin DI
koin.version=3.5.6

# OkHttp
okhttp.version=4.12.0

# Logging
koin.log.level=WARNING