[versions]
kotlin = "2.0.20"
compose = "1.6.10"
composeBom = "2024.08.00"
agp = "8.4.0"
coroutines = "1.8.1"
serialization = "1.6.3"
datetime = "0.6.1"
collections = "0.3.5"
napier = "2.12.0"
ktor = "3.0.3"
okio = "3.9.1"
voyager = "0.5.0"
lifecycle = "2.8.2"
activity = "1.9.0"
window = "1.3.0"
okhttp = "4.12.0"
kotlinxCoroutines = "1.8.1"
ktlint = "11.0.0"
detekt = "1.23.6"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-js = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core-js", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "collections" }
napier = { module = "com.github.aakira:napier", version.ref = "napier" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-contentNegotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-serialization-kotlinxJson = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
voyager = { module = "com.adamkobus:voyager", version.ref = "voyager" }
voyager-bottomNavigation = { module = "com.adamkobus:voyager-bottom-navigation", version.ref = "voyager" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-window = { module = "androidx.window:window", version.ref = "window" }

# Compose libraries (using BOM)
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "compose" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "compose" }
compose-components-resources = { module = "androidx.compose.ui:ui-resources", version.ref = "compose" }
compose-components-defaults = { module = "androidx.compose.material3:material3", version.ref = "compose" }
compose-animation = { module = "androidx.compose.animation:animation", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics", version.ref = "compose" }
compose-ui-text = { module = "androidx.compose.ui:ui-text", version.ref = "compose" }
compose-ui-unit = { module = "androidx.compose.ui:ui-unit", version.ref = "compose" }
compose-ui-geometry = { module = "androidx.compose.ui:ui-geometry", version.ref = "compose" }
compose-ui-platform-android = { module = "androidx.compose.ui:ui-platform-android", version.ref = "compose" }
compose-ui-platform-ios = { module = "androidx.compose.ui:ui-platform-ios", version.ref = "compose" }
compose-ui-platform-jvm = { module = "androidx.compose.ui:ui-platform-jvm", version.ref = "compose" }
compose-ui-platform-wasm = { module = "androidx.compose.ui:ui-platform-wasm", version.ref = "compose" }

[plugins]
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }