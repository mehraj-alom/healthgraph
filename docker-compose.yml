version: '3.8'

services:
  api:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - neo4j
      - qdrant
    volumes:
      - .:/app

  celery-worker:
    build: .
    command: celery -A core.celery_app worker --loglevel=info
    depends_on:
      - postgres
      - redis
      - neo4j
    volumes:
      - .:/app

  celery-beat:
    build: .
    command: celery -A core.celery_app beat --loglevel=info
    depends_on:
      - redis
    volumes:
      - .:/app

      
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: medgraph
      POSTGRES_PASSWORD: password
      POSTGRES_DB: medgraph_db
    ports:
      - "5432:5432"
    mem_limit: 1g
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    mem_limit: 256m

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_dbms_memory_heap_initial__size: 256m
      NEO4J_dbms_memory_heap_max__size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    mem_limit: 1g
    volumes:
      - neo4jdata:/data

  qdrant:
    container_name: qdrant
    image: qdrant/qdrant:latest
    restart: always
    ports:
      - "6333:6333" 
      - "6334:6334" 
    volumes:
      - ./volume/qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

volumes:
  pgdata:
  neo4jdata:
  qdrantdata: