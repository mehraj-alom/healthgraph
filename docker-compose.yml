version: '3.8'

services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://medgraph:password@postgres:5432/medgraph_db
      - ASYNC_DATABASE_URL=postgresql+asyncpg://medgraph:password@postgres:5432/medgraph_db
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - neo4j
      - qdrant
    volumes:
      - .:/app

  celery-worker:
    build: .
    command: celery -A core.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgresql://medgraph:password@postgres:5432/medgraph_db
      - ASYNC_DATABASE_URL=postgresql+asyncpg://medgraph:password@postgres:5432/medgraph_db
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - VISION_AGENT_API_KEY=${LANDINGAI_API_KEY}
      - OPENAI_API_KEY=${AICREDITS_API_KEY}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-https://api.aicredits.in/v1}
    depends_on:
      - postgres
      - redis
      - neo4j
    volumes:
      - .:/app

  celery-beat:
    build: .
    command: celery -A core.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgresql://medgraph:password@postgres:5432/medgraph_db
    depends_on:
      - redis
    volumes:
      - .:/app

      
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-medgraph_db}
    ports:
      - "5432:5432"
    mem_limit: 1g
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    mem_limit: 256m

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}
      NEO4J_dbms_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-256m}
      NEO4J_dbms_memory_heap_max__size: ${NEO4J_HEAP_MAX:-512m}
    ports:
      - "7475:7474"
      - "7688:7687"
    mem_limit: 1g
    volumes:
      - neo4jdata:/data

  qdrant:
    container_name: qdrant
    image: qdrant/qdrant:latest
    restart: always
    ports:
      - "6333:6333" 
      - "6334:6334" 
    volumes:
      - ./volume/qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=${QDRANT_GRPC_PORT:-6334}

volumes:
  pgdata:
  neo4jdata: