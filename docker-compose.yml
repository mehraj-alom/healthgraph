services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    volumes:
      - ./firebase_credentials.json:/app/firebase_credentials.json:ro
      - document_storage:/app/storage
    ports:
      - "8000:8000"
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A core.celery_app worker -Q celery,ingestion --loglevel=info
    env_file:
      - .env
    volumes:
      - document_storage:/app/storage
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A core.celery_app beat --loglevel=info
    env_file:
      - .env
    restart: unless-stopped

volumes:
  document_storage: