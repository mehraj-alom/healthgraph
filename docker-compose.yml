services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    volumes:
      - ./firebase_credentials.json:/app/firebase_credentials.json:ro
      - document_storage:/app/storage
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      rppg-inference:
        condition: service_healthy

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A core.celery_app worker -Q celery,ingestion --loglevel=info
    env_file:
      - .env
    volumes:
      - document_storage:/app/storage
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A core.celery_app beat --loglevel=info
    env_file:
      - .env
    restart: unless-stopped

  rppg-inference:
    build:
      context: ./backend/rppg_service
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.5
    ports:
      - "8080:8080"
    environment:
      - RPPG_MODEL_PATH=/app/physformer_rppg_fp16.onnx
      - PORT=8080
      - ORT_INTRA_THREADS=4
      - ORT_INTER_THREADS=2
      - USE_CUDA=false
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  document_storage: